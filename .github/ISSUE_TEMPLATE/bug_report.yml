name: Bug 反馈
description: 提交一个问题报告，帮助我们改进墨记 MoMark
title: '[Bug] '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        **提交前请先搜索[已有 issue](https://github.com/lixiaoshuang79/momark/issues)**，避免重复；若已有相同问题，用 👍 表示支持即可。

        附上截图或录屏能显著加快定位速度。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简洁清晰地说明你遇到的问题。
      placeholder: 发生了什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 详细描述如何复现该问题。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现问题
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      placeholder: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 日志
      description: 帮助说明问题的截图或错误日志，界面类问题推荐 GIF。非必填。

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS（Apple 芯片）
        - macOS（Intel）
        - 其他（自行构建）
    validations:
      required: true

  - type: input
    id: momark-version
    attributes:
      label: 墨记版本
      placeholder: '例如 1.2.1'
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 系统版本
      placeholder: '例如 macOS 15.3'
    validations:
      required: true

  - type: checkboxes
    id: reproducible
    attributes:
      label: 复现情况
      options:
        - label: 我可以稳定复现该问题
